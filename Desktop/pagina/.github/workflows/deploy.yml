name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Desktop/vscode claude code portfolio/site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: "Desktop/vscode claude code portfolio/site"

      - name: Build
        run: npm run build
        working-directory: "Desktop/vscode claude code portfolio/site"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Desktop/vscode claude code portfolio/site/out"

      - id: deployment
        uses: actions/deploy-pages@v4
